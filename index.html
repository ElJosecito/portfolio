<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Contraparte de public/404.html. Cuando GitHub Pages manda una ruta de
      // cliente acá convertida en query (`/?/projects/mi-app`), esto la vuelve a
      // poner en la barra de direcciones antes de que React monte, así el router
      // ve la ruta real y no la raíz.
      //
      // Va inline y antes del módulo a propósito: si corriera después, el router
      // ya habría leído `/` y renderizado la portada.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Los metadatos de acá son los que ven los crawlers que no ejecutan
         JavaScript: LinkedIn, WhatsApp, Slack, Discord, Telegram. Son el piso.
         El hook useSeo los sobreescribe por ruta una vez que la app arranca,
         que es lo que consume Google en su segunda pasada. -->
    <title data-seo="title">Jose Martinez — Mobile Tech Lead · React Native</title>
    <meta
      data-seo="description"
      name="description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana. Apps con React Native publicadas en App Store y Google Play, y proyectos web con React y Next.js."
    />
    <meta name="author" content="Jose Miguel Martinez Florimon" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link data-seo="canonical" rel="canonical" href="https://josecito.dev/" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efeef2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jose Martinez" />
    <meta data-seo="og:url" property="og:url" content="https://josecito.dev/" />
    <meta
      data-seo="og:title"
      property="og:title"
      content="Jose Martinez — Mobile Tech Lead · React Native"
    />
    <meta
      data-seo="og:description"
      property="og:description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana. Apps con React Native publicadas en App Store y Google Play, y proyectos web con React y Next.js."
    />
    <meta data-seo="og:image" property="og:image" content="https://josecito.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jose Martinez — Mobile Tech Lead · React Native" />
    <meta data-seo="og:locale" property="og:locale" content="es_DO" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      data-seo="twitter:title"
      name="twitter:title"
      content="Jose Martinez — Mobile Tech Lead · React Native"
    />
    <meta
      data-seo="twitter:description"
      name="twitter:description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana."
    />
    <meta data-seo="twitter:image" name="twitter:image" content="https://josecito.dev/og-image.jpg" />

    <!-- Los iconos son archivos propios en public/. Antes apuntaban a un link
         `/s/` de Dropbox que hoy devuelve un 302 a HTML: el sitio no tenía
         favicon. Y encima estaba declarado como SVG siendo un PNG. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Inter va acá y no como @import en el CSS para no encadenar dos
         descargas antes del primer render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Fuente puntual del mono de las notas/nav/CTA del hero 3D. Solo 400
         (texto normal) y 700 (font-bold): 500/600 se pidieron en algún
         momento pero nunca se usaron — ningún className combina `font-tech`
         con `font-medium`/`font-semibold` en todo el código (ver revisión,
         punto 17) — así que eran dos variantes de más que Google Fonts
         mandaba igual. Va en el mismo preconnect de arriba, no cambia el
         body (Inter sigue siendo la fuente global). -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Milker (ver @font-face en style.css) se precarga SOLO si hace falta:
         la landing clásica, el panel de admin y el detalle de proyecto no la
         usan en absoluto, pero este `<link>` vivía en el `<head>` global, así
         que pagaba esa descarga igual en TODAS las rutas (ver revisión,
         punto 17). `font-display: swap` (ya puesto en el @font-face) ya
         evita que el texto quede invisible mientras carga — el peor caso sin
         preload es un salto del fallback del sistema a Milker una vez que
         termine de bajar, no texto en blanco, así que no vale la pena
         forzar la descarga temprano en rutas que ni siquiera la pintan. -->
    <script>
      if (window.location.pathname === "/") {
        var milkerPreload = document.createElement("link");
        milkerPreload.rel = "preload";
        milkerPreload.href = "/fonts/Milker.woff2";
        milkerPreload.as = "font";
        milkerPreload.type = "font/woff2";
        milkerPreload.crossOrigin = "anonymous";
        document.head.appendChild(milkerPreload);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
