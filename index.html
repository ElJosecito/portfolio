<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Contraparte de public/404.html. Cuando GitHub Pages manda una ruta de
      // cliente acá convertida en query (`/?/projects/mi-app`), esto la vuelve a
      // poner en la barra de direcciones antes de que React monte, así el router
      // ve la ruta real y no la raíz.
      //
      // Va inline y antes del módulo a propósito: si corriera después, el router
      // ya habría leído `/` y renderizado la portada.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Los metadatos de acá son los que ven los crawlers que no ejecutan
         JavaScript: LinkedIn, WhatsApp, Slack, Discord, Telegram. Son el piso.
         El hook useSeo los sobreescribe por ruta una vez que la app arranca,
         que es lo que consume Google en su segunda pasada. -->
    <title data-seo="title">Jose Martinez — Mobile Tech Lead · React Native</title>
    <meta
      data-seo="description"
      name="description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana. Apps con React Native publicadas en App Store y Google Play, y proyectos web con React y Next.js."
    />
    <meta name="author" content="Jose Miguel Martinez Florimon" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link data-seo="canonical" rel="canonical" href="https://josecito.dev/" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efeef2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jose Martinez" />
    <meta data-seo="og:url" property="og:url" content="https://josecito.dev/" />
    <meta
      data-seo="og:title"
      property="og:title"
      content="Jose Martinez — Mobile Tech Lead · React Native"
    />
    <meta
      data-seo="og:description"
      property="og:description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana. Apps con React Native publicadas en App Store y Google Play, y proyectos web con React y Next.js."
    />
    <meta data-seo="og:image" property="og:image" content="https://josecito.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jose Martinez — Mobile Tech Lead · React Native" />
    <meta data-seo="og:locale" property="og:locale" content="es_DO" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      data-seo="twitter:title"
      name="twitter:title"
      content="Jose Martinez — Mobile Tech Lead · React Native"
    />
    <meta
      data-seo="twitter:description"
      name="twitter:description"
      content="Portfolio de Jose Martinez, Mobile Tech Lead desde La Romana, República Dominicana."
    />
    <meta data-seo="twitter:image" name="twitter:image" content="https://josecito.dev/og-image.jpg" />

    <!-- Los iconos son archivos propios en public/. Antes apuntaban a un link
         `/s/` de Dropbox que hoy devuelve un 302 a HTML: el sitio no tenía
         favicon. Y encima estaba declarado como SVG siendo un PNG. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Inter va acá y no como @import en el CSS para no encadenar dos
         descargas antes del primer render. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sin bloquear el render (Lighthouse: "render-blocking requests", ~710 ms
         en móvil): se pide como preload y se aplica como hoja de estilos al
         terminar de bajar. `display=swap` ya hace que el texto se vea desde el
         primer frame con la fuente del sistema mientras tanto. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" />
    </noscript>

    <!-- Fuente puntual del mono de las notas/nav/CTA del hero 3D. Solo 400
         (texto normal) y 700 (font-bold): 500/600 se pidieron en algún
         momento pero nunca se usaron — ningún className combina `font-tech`
         con `font-medium`/`font-semibold` en todo el código (ver revisión,
         punto 17) — así que eran dos variantes de más que Google Fonts
         mandaba igual. Va en el mismo preconnect de arriba, no cambia el
         body (Inter sigue siendo la fuente global). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
    </noscript>

    <!-- Milker (ver @font-face en style.css) se precarga en TODAS las rutas:
         el nombre del header (wordmark) la usa en cada página. Pesa 14 kB;
         sin preload el nombre aparecería primero con la fuente del sistema y
         saltaría a Milker al terminar de bajar. -->
    <link rel="preload" href="/fonts/Milker.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      if (window.location.pathname === "/") {
        // El modelo 3D de la cabeza (~400 kB, el archivo más pesado de la
        // portada) se pedía recién cuando ya habían bajado el JS principal,
        // el chunk del landing nuevo y el de three.js. Pedirlo desde acá lo
        // baja en paralelo con todo eso. Mismos chequeos baratos que
        // `resolveLandingVariant` (deviceCapability.js) — todos menos WebGL,
        // que es caro de probar acá — para no bajarlo en equipos que van a
        // ver la landing clásica. `as="fetch"` + `crossorigin` coinciden con
        // el `fetch()` de IntroLoader y el de GLTFLoader, así reusan esta
        // misma descarga en vez de repetirla.
        var variant = new URLSearchParams(window.location.search).get("landing");
        var nav = window.navigator;
        var capable =
          variant === "new" ||
          (variant !== "classic" &&
            !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
            !(nav.connection && nav.connection.saveData) &&
            !(typeof nav.deviceMemory === "number" && nav.deviceMemory < 4) &&
            !(typeof nav.hardwareConcurrency === "number" && nav.hardwareConcurrency < 4));
        if (capable) {
          var modelPreload = document.createElement("link");
          modelPreload.rel = "preload";
          modelPreload.href = "/models/face.glb";
          modelPreload.as = "fetch";
          modelPreload.crossOrigin = "anonymous";
          document.head.appendChild(modelPreload);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
