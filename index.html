<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // Contraparte de public/404.html. Cuando GitHub Pages manda una ruta de
      // cliente acá convertida en query (`/?/projects/mi-app`), esto la vuelve a
      // poner en la barra de direcciones antes de que React monte, así el router
      // ve la ruta real y no la raíz.
      //
      // Va inline y antes del módulo a propósito: si corriera después, el router
      // ya habría leído `/` y renderizado la portada.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');

          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- Los metadatos de acá son los que ven los crawlers que no ejecutan
         JavaScript: LinkedIn, WhatsApp, Slack, Discord, Telegram. Son el piso.
         El hook useSeo los sobreescribe por ruta una vez que la app arranca,
         que es lo que consume Google en su segunda pasada. -->
    <title data-seo="title">Jose Martinez — Desarrollador Web y Mobile Full-Stack</title>
    <meta
      data-seo="description"
      name="description"
      content="Portfolio de Jose Martinez, desarrollador web y mobile full-stack desde La Romana, República Dominicana. Proyectos con React, React Native, Node.js y MongoDB."
    />
    <meta name="author" content="Jose Miguel Martinez Florimon" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link data-seo="canonical" rel="canonical" href="https://josecito.dev/" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#efeef2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />

    <!-- Open Graph -->

    <meta data-seo="og:url" property="og:url" content="https://josecito.dev/" />
    <meta

    <!-- Twitter / X -->

    <!-- Los iconos son archivos propios en public/. Antes apuntaban a un link
         `/s/` de Dropbox que hoy devuelve un 302 a HTML: el sitio no tenía
         favicon. Y encima estaba declarado como SVG siendo un PNG. -->
