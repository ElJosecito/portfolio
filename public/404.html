<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      // GitHub Pages 404 -> redirect to index and preserve path in hash
      (function () {
        var path = window.location.pathname + window.location.search + window.location.hash;
        var index = '/';
        // If repo is not at root, try to preserve the base automatically
        if (window.location.pathname.indexOf('.html') !== -1) {
          window.location.replace(index + '#' + path);
        } else {
          window.location.replace(index + '#' + path);
        }
      })();
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
